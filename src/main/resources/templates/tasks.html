<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org ">
<head>
    <meta charset="UTF-8">
    <title>Todo Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <style>
        .text-strikethrough{
            text-decoration: line-through;
            color :gray;
        }

    </style>
</head>
<body>

</body>
<div class = "container">
    <h1 class ="mt-5 text-center">Todo Application</h1>
    <form th:action="@{/tasks/addTasks}" method="POST" class="row mt-3">
        <div>
            <input class="form-control form-control-lg" type="text" name="title" placeholder="Task title" required>

        </div>
        <div class ="d-flex justify-content-center mt-3">
            <button type="submit" class ="btn btn-primary btn-lg btn-block">Add</button>
        </div>

    </form>
    <div class = "mt-4 ">
    <th:block th:each="task : ${tasks}">
         <div class = "card mb-2">
             <div class = "card-body d-flex justify-content-between align-items-center">
             <span th:classappend="${task.completed}?'text-strikethrough'"th:text="${task.title}"> Task Title </span>
                 <div class = "btn-group align-self-end">
                     <a th:href="@{/tasks/{id}/toggle(id=${task.id})}" class="btn btn-outline-secondary btn-sm">toggle</a>

                     <a th:href="@{/tasks/deleteTask(id=${task.id})}" class="btn btn-outline-danger btn-sm">Delete</a>
                 </div>
             </div>
         </div>

    </th:block>
    </div>
</div>
</html>
